name: MSC Fleet Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: msc-fleet-tracker
  cancel-in-progress: true

jobs:
  update-fleet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install websockets openpyxl

      - name: Run Fleet Tracker
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python FleetTracker.py

      - name: Commit updated fleet data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fleet_positions.xlsx fleet_known_positions.json
          git diff --cached --quiet || git commit -m "Automatic fleet position update"
          git push
